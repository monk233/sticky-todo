[package]
name = "sticky-todo"
version = "1.5.1"
description = "轻量级桌面便签与待办清单"
authors = ["monk233"]
edition = "2021"

[lib]
name = "sticky_todo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
# 让 Tauri 加载嵌入二进制的前端资源，而不是去连 devUrl 的开发服务器。
# 缺少这个 feature 时程序会认为自己在开发模式，界面会是空白的。
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
# 用默认的 rustls 后端。曾试过 default-features = false + native-tls 想省体积，
# 结果 ureq 2.12 在发 HTTPS 时直接报「no TLS backend is configured」——换成
# 别的后端必须跑 update::tests::real_endpoint_is_reachable 验证过才算数。
ureq = "2"

[target.'cfg(windows)'.dependencies]
# 自己发 WinRT toast：要自定义 AUMID，还要「延后」按钮的回调，插件两样都不给。
tauri-winrt-notification = "0.8"
# 免安装的应用没有安装器代劳，AUMID 只能自己登记到 HKCU。
winreg = "0.10"
# 写开始菜单快捷方式用：通知卡片那行名字只认快捷方式上的 AUMID。
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
