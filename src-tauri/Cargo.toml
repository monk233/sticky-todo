[package]
name = "sticky-todo"
version = "1.0.0"
description = "轻量级桌面便签与待办清单"
authors = ["monk233"]
edition = "2021"

[lib]
name = "sticky_todo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
# 让 Tauri 加载嵌入二进制的前端资源，而不是去连 devUrl 的开发服务器。
# 缺少这个 feature 时程序会认为自己在开发模式，界面会是空白的。
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
