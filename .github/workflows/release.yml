name: 构建并发布

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的版本标签，例如 v1.0.1
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 生成「本次更新」要拿上一个 tag 并列出区间提交，浅克隆里两者都没有。
          fetch-depth: 0
          fetch-tags: true

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 编译产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 运行 Rust 单元测试
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: 运行前端单元测试
        run: node --test "src/*.test.js"

      - name: 检查 tag 与版本号是否一致
        shell: pwsh
        run: |
          # 不一致的话，自动更新会把同一个版本反复当成新版本推给用户。
          $tag = "${{ inputs.tag || github.ref_name }}".Trim()
          $version = $tag.TrimStart("v")
          $cargo = [regex]::Match((Get-Content src-tauri/Cargo.toml -Raw), 'version = "([^"]+)"').Groups[1].Value
          $config = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($version -ne $cargo -or $version -ne $config) {
            throw "版本号对不上：tag=$version Cargo.toml=$cargo tauri.conf.json=$config"
          }
          Write-Host "版本号一致：$version"

      - name: 构建 release
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: 检查产物
        run: |
          $exe = "src-tauri\target\release\sticky-todo.exe"
          if (-not (Test-Path $exe)) { throw "没有找到 $exe" }
          $size = (Get-Item $exe).Length
          Write-Host ("产物 {0:N0} 字节（{1:N2} MB）" -f $size, ($size / 1MB))

      - name: 生成本次更新说明
        shell: pwsh
        run: |
          # 说明里要带上这个版本实际改了什么，不能每个版本都是同一段话。
          $tag = "${{ inputs.tag || github.ref_name }}"
          $previous = git describe --tags --abbrev=0 "$tag^" 2>$null
          if (-not $previous) {
            $previous = git rev-list --max-parents=0 HEAD | Select-Object -Last 1
          }
          $commits = git log --pretty=format:"- %s" "$previous..$tag" | Out-String
          if ([string]::IsNullOrWhiteSpace($commits)) {
            $commits = "- 检出时没拿到提交历史，这次没能列出改动"
          }

          $lines = @(
            '下载 `sticky-todo.exe` 直接运行，不需要安装。',
            '',
            '运行依赖系统的 WebView2 运行时，Windows 11 已内置；Windows 10 上如果缺失，需要先装一次 WebView2 Runtime。',
            '',
            '产物没有代码签名，首次运行 Windows 可能提示「未知发布者」，选择「更多信息 → 仍要运行」即可。',
            '',
            "### 本次更新（$previous → $tag）",
            $commits
          )
          Set-Content -Path release-body.md -Value ($lines -join "`n") -Encoding utf8
          Write-Host "已生成 release-body.md"

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          body_path: release-body.md
          files: src-tauri/target/release/sticky-todo.exe
          draft: false
          prerelease: false
