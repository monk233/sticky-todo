name: 构建并发布

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的版本标签，例如 v1.0.1
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 编译产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 运行 Rust 单元测试
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: 运行前端单元测试
        run: node --test "src/*.test.js"

      - name: 构建 release
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: 检查产物
        run: |
          $exe = "src-tauri\target\release\sticky-todo.exe"
          if (-not (Test-Path $exe)) { throw "没有找到 $exe" }
          $size = (Get-Item $exe).Length
          Write-Host ("产物 {0:N0} 字节（{1:N2} MB）" -f $size, ($size / 1MB))

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          body: |
            下载 `sticky-todo.exe` 直接运行，不需要安装。

            运行依赖系统的 WebView2 运行时，Windows 11 已内置；Windows 10 上
            如果缺失，需要先装一次 WebView2 Runtime。

            产物没有代码签名，首次运行 Windows 可能提示「未知发布者」，
            选择「更多信息 → 仍要运行」即可。
          files: src-tauri/target/release/sticky-todo.exe
          draft: false
          prerelease: false
